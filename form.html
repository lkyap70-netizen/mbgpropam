<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Form Pengawasan MBG Polri</title>
<style>
:root{--bg:#e9edf2;--pn:#fff;--tx:#1a1d23;--mu:#667085;--bd:#d5dae2;--ac:#1d4ed8;--in:#f5f7fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--pn:#1c1f26;--tx:#e8eaee;--mu:#9aa3b2;--bd:#363b46;--ac:#6b9bff;--in:#14171c}}
:root[data-theme="dark"]{--bg:#111317;--pn:#1c1f26;--tx:#e8eaee;--mu:#9aa3b2;--bd:#363b46;--ac:#6b9bff;--in:#14171c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Arial,sans-serif}
.app{display:block}
.panel{background:var(--pn);border-bottom:1px solid var(--bd);padding:12px}
.panel h1{font-size:16px;margin:0 0 8px}
details{border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;background:var(--pn)}
summary{padding:9px 12px;font-weight:600;cursor:pointer}
.b{padding:2px 12px 12px;display:grid;gap:8px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input:not([type=file]){padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--in);color:var(--tx);font:14px system-ui,Arial,sans-serif;width:100%}
.sub{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--mu);margin-top:4px}
.chip{font-weight:700;color:var(--ac)}
button,.fb{padding:8px 12px;border:1px solid var(--ac);background:var(--ac);color:#fff;border-radius:6px;font:600 13px system-ui,Arial,sans-serif;cursor:pointer;text-align:center}
button.s,.fb.s{background:transparent;color:var(--ac)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.im{display:flex;gap:10px;align-items:center}
.th{width:54px;height:54px;border:1px solid var(--bd);border-radius:6px;background:var(--in) center/contain no-repeat;flex:none}
.ib{flex:1;display:grid;gap:5px;font-size:13px}
.ib span{display:flex;gap:6px}
.ib .fb,.ib button{flex:1;padding:5px 6px;font-size:12px}
.hint{font-size:12px;color:var(--mu);margin:6px 0 0}
.act{display:grid;gap:8px;margin-top:4px}
.stage{padding:12px 8px;overflow:hidden}
.page{width:215mm;height:329.4mm;padding:19.4mm 19.05mm 10mm 31.75mm;background:#fff;color:#000;margin:0 auto 12px;box-shadow:0 2px 12px #0003;font:9pt/1.2 Arial,Helvetica,sans-serif}
.content{height:300mm;overflow:hidden}
.kop{text-align:center;font-size:11pt;line-height:1.17;width:84.8mm;margin-left:5.6mm}
.lg{height:19.4mm;margin-bottom:2.5mm}.lg img{height:19.4mm}
.ul{display:block;border-bottom:.25mm solid #000;padding-bottom:.6mm}
h2{text-align:center;font-size:11pt;line-height:1.17;margin:6.5mm 0 6mm;padding-right:5mm}
.meta{display:grid;grid-template-columns:24mm 3mm 1fr;font-size:11pt;line-height:1.17;row-gap:4.8mm;margin:0 0 3.5mm 5.6mm}
.t{border-collapse:collapse;width:149.9mm;margin-left:4.06mm;table-layout:fixed}
.t td,.t th{border:.2mm solid #000;padding:.4mm 1.2mm;vertical-align:top}
.t th{background:#d9d9d9;text-align:center}
.t td.n{text-align:center}.t td.c{text-align:center;cursor:pointer;font-size:9pt}
.t tr.sec td{background:#d9d9d9;font-weight:700}.t tr.sec td+td{text-align:center}
.phw{text-align:center;margin-top:6mm}
.phw img{max-width:160mm;max-height:150mm}
.empty{border:.4mm dashed #999;color:#888;padding:30mm 0}
.sig{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-size:9pt;margin-top:8mm;line-height:1.35}
.sig .tt{position:relative;height:35mm;display:flex;align-items:center;justify-content:center}
.sig .tt img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:none}
@media (min-width:900px){
.app{display:grid;grid-template-columns:340px 1fr;align-items:start}
.panel{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--bd);border-bottom:0}
.stage{padding:18px 12px}
}
@media print{
@page{size:215mm 330mm;margin:0}
html,body{background:#fff}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.panel{display:none!important}
.app{display:block}.stage{padding:0;overflow:visible}
#pages{zoom:1!important}
.page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
.page:last-child{break-after:auto;page-break-after:auto}
.empty{border:0;color:transparent}
.t td.c{cursor:auto}
}
.pst{position:relative;width:150mm;height:150mm;margin:0 auto}
.phw .pst img{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;max-height:none}
.gc{position:absolute;background:#fff center/cover no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdfm .empty{border:0;color:transparent}
</style></head><body>

["H","B.","PENGAWASAN STANDAR GIZI MBG POLRI"],
["I","1","Pengawasan kepada Ahli Gizi dalam perhitungan jumlah energi (kkal), karbohidrat (g), protein (g), lemak (g), dalam 1 piring makan, apakah sudah sesuai dengan standar yang diberikan BGN, dan menyesuaikan dengan standar makanan oleh Kemenkes.",1],

["I","3","Pengawasan terhadap penyajian di kotak atau ompreng makanan, meliputi kebersihan kotak makanan, dan kerapatan kotak saat makanan ditutup agar tidak tumpah dan tercemar kotoran dari luar",1],
["I","4","Pengawasan pengangkutan makanan ke mobil",1],
